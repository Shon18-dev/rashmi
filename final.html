<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy 4 Months, Rashmi 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--pink:#ffd6e0;--rose:#ff8fab;--deep:#e0527a;--cream:#fff8f0;--lav:#e6d9ff;--text:#5a3d4a}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Quicksand',sans-serif;color:var(--text);background:linear-gradient(180deg,var(--cream),var(--pink) 50%,var(--lav));background-attachment:fixed;overflow-x:hidden}
h1,h2,.script{font-family:'Dancing Script',cursive,serif;color:var(--deep)}
section{padding:70px 20px;max-width:900px;margin:auto;text-align:center;position:relative;z-index:2}
h2{font-size:2.4rem;margin-bottom:28px}
.hearts{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.hearts span{position:absolute;bottom:-40px;animation:float linear infinite;opacity:.6}
@keyframes float{to{transform:translateY(-110vh) rotate(40deg);opacity:0}}
.reveal{opacity:0;transform:translateY(30px);transition:all .9s ease}
.reveal.show{opacity:1;transform:none}
/* hero */
#hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
#hero h1{font-size:clamp(2.6rem,10vw,5rem);line-height:1.1}
#hero p{margin-top:16px;font-size:1.15rem;max-width:420px}
.big{font-size:3rem;animation:beat 1.4s infinite}
@keyframes beat{50%{transform:scale(1.2)}}
.hint{margin-top:40px;font-size:.9rem;opacity:.7;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(8px)}}
/* counter */
.count{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.box{background:#fff;border-radius:20px;padding:16px 14px;min-width:78px;box-shadow:0 8px 24px #e0527a22}
.box b{display:block;font-size:2rem;color:var(--deep)}
.box small{font-size:.8rem}
/* gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:26px}
.polaroid{background:#fff;padding:12px 12px 16px;border-radius:6px;box-shadow:0 10px 26px #0002;cursor:pointer;transition:transform .3s}
.polaroid:nth-child(odd){transform:rotate(-3deg)}
.polaroid:nth-child(even){transform:rotate(3deg)}
.polaroid:hover{transform:rotate(0) scale(1.04)}
.polaroid .ph{aspect-ratio:1;background:linear-gradient(135deg,var(--pink),var(--lav));border-radius:3px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:2.5rem}
.polaroid img{width:100%;height:100%;object-fit:cover}
.polaroid p{margin-top:10px;font-family:'Dancing Script',cursive;font-size:1.3rem;color:var(--deep)}
#lightbox{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:50;padding:20px;flex-direction:column;color:#fff}
#lightbox.on{display:flex}
#lightbox img{max-width:100%;max-height:78vh;border-radius:10px}
/* notes */
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.card{perspective:900px;height:170px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;align-items:center;justify-content:center;padding:18px;box-shadow:0 8px 22px #e0527a2a}
.front{background:#fff;font-size:1.1rem;color:var(--deep);font-weight:600}
.back{background:var(--rose);color:#fff;transform:rotateY(180deg);font-size:1.05rem;line-height:1.5}
/* music */
.song{background:#fff;border-radius:24px;padding:26px;box-shadow:0 8px 24px #e0527a22}
.song iframe{width:100%;border:0;border-radius:14px;margin-top:14px}
.song audio{width:100%;margin-top:14px}
.btn{display:inline-block;margin-top:14px;padding:13px 28px;border:0;border-radius:40px;background:var(--deep);color:#fff;font:600 1rem 'Quicksand',sans-serif;text-decoration:none;cursor:pointer;box-shadow:0 6px 16px #e0527a55}
.btn:active{transform:scale(.96)}
/* letter */
.letter{background:#fffdf7;border-radius:6px;padding:34px 26px;text-align:left;box-shadow:0 12px 30px #0002;line-height:1.9;font-size:1.05rem;background-image:repeating-linear-gradient(transparent,transparent 31px,#f3d9e0 32px)}
.letter .sign{font-family:'Dancing Script',cursive;font-size:1.8rem;color:var(--deep);margin-top:16px;text-align:right}
footer{padding:40px 20px 60px;text-align:center;position:relative;z-index:2}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:60}
#intro{position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,var(--cream),var(--pink),var(--lav));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;transition:opacity .8s}
#intro.hide{opacity:0;pointer-events:none}
#intro h1{font-size:clamp(2.2rem,9vw,4rem);margin-bottom:10px}
#musicBtn{position:fixed;right:16px;bottom:16px;z-index:70;width:48px;height:48px;border-radius:50%;border:0;background:var(--deep);color:#fff;font-size:1.3rem;box-shadow:0 6px 16px #e0527a66;cursor:pointer;display:none}
</style>
</head>
<body>

<script>
/* ================= EDIT EVERYTHING HERE ================= */
const CONFIG = {
  herName: "Rashmi muthu",
  yourName: "Shaun",
  startDate: "2026-07-28",            // YYYY-MM-DD
  heroSubtitle: "Four months of you, four months of me, and a lifetime to go 💞",

  // Put your photos in the SAME folder as this file and name them like below.
  photos: [
    {src:"1.jpg", caption: "Us 🥰" },
    {src:"2.jpg", caption: "My favourite smile" },
    {src:"3.jpg", caption: "I love your face" },
    {src:"4.jpg", caption: "Always you" },
    {src:"5(1).jpg", caption: "Missing egypt" },
    {src:"6.jpg", caption: "My hottie" }
  ],

  // Front = what she sees first, back = hidden message when she taps
  notes: [
    { front: "Tap me 💌", back: "You make even my boring days feel special, Rashmi baby." },
    { front: "Why I smile 😊", back: "Because of you. Every text, every call, every little moment." },
    { front: "My safe place 🏡", back: "Wherever you are is home to me." },
    { front: "My favourite thing ✨", back: "Hearing your laugh. I'd do anything to hear it more." },
    { front: "Thank you 🌷", back: "For being patient, caring and so beautifully you." },
    { front: "Promise 🤞", back: "I'll keep choosing you, today and every day after." }
  ],

  // SONG: "And I Love Her" - The Beatles (plays in the background after she taps "open")
  songFile: "song.mp3",        // put the mp3 in the same folder as index.html
  songYouTubeId: "",           // OR if you have no mp3: the part after v= in the YouTube link
  songNote: "Our song. Every time it plays, I think of you. 🎶",

  letter: `My Baby muthumani vave pone cutie Rashmi,

Four months so fast its gone baby, with you its always easy for me, you always make it easier for me without knowing. I love you so much, i hope i make you happy too. i know there alot of stupid stuff i do but please bear w me baby, i hope for many more months of us together and forever ofc. UMMMMAAAAA always baby you are the best and you will always be the best, i love you so much`,
  letterEnd: "I love you so much ❤️"
};
/* ========================================================= */
</script>

<div class="hearts" id="hearts"></div>

<section id="hero">
  <div class="big">💖</div>
  <h1 id="h1">Happy 4 Months</h1>
  <p id="sub"></p>
  <div class="hint">scroll down ↓</div>
</section>

<section class="reveal">
  <h2>Our time together</h2>
  <div class="count" id="count"></div>
  <p style="margin-top:20px">…and counting 💞</p>
</section>

<section class="reveal">
  <h2>Our little memories</h2>
  <div class="gallery" id="gallery"></div>
  <p style="margin-top:16px;font-size:.85rem;opacity:.7">tap a photo to see it bigger</p>
</section>

<section class="reveal">
  <h2>Little love notes</h2>
  <div class="notes" id="notes"></div>
</section>

<section class="reveal">
  <h2>Our song 🎶</h2>
  <div class="song">
    <div class="script" style="font-size:1.8rem">And I Love Her</div>
    <div>The Beatles</div>
    <div id="player"></div>
    <p style="margin-top:14px" id="songNote"></p>
  </div>
</section>

<section class="reveal">
  <h2>A letter for you</h2>
  <div class="letter">
    <div id="letter"></div>
    <div class="sign" id="end"></div>
  </div>
  <button class="btn" id="burst">Click me 💌</button>
</section>

<footer class="script" style="font-size:1.5rem" id="foot"></footer>

<div id="lightbox"><img id="lbimg" alt=""><p class="script" id="lbcap" style="font-size:1.8rem;margin-top:10px;color:#fff"></p></div>
<canvas id="cf"></canvas>
<div id="intro">
  <div class="big">💌</div>
  <h1>I made something for you</h1>
  <button class="btn" id="openBtn">Tap to open 💖</button>
</div>
<button id="musicBtn" aria-label="Toggle music">🔊</button>
<div style="position:fixed;left:-9999px;top:0"><div id="ytHolder"></div></div>

<script>
const $ = id => document.getElementById(id);
const C = CONFIG;

// Text
document.title = `Happy 4 Months, ${C.herName} 💕`;
$('h1').innerHTML = `Happy 4 Months,<br>${C.herName} 💕`;
$('sub').textContent = C.heroSubtitle;
$('songNote').textContent = C.songNote;
$('letter').innerHTML = C.letter.split('\n\n').map(p => `<p style="margin-bottom:14px">${p}</p>`).join('');
$('end').textContent = C.letterEnd + ' — ' + C.yourName;
$('foot').textContent = `Made with love by ${C.yourName} 💗`;

// Floating hearts
const hs = $('hearts'), em = ['💗','💕','✨','🌸','💖'];
for (let i = 0; i < 18; i++) {
  const s = document.createElement('span');
  s.textContent = em[i % em.length];
  s.style.left = Math.random() * 100 + '%';
  s.style.fontSize = (14 + Math.random() * 22) + 'px';
  s.style.animationDuration = (9 + Math.random() * 10) + 's';
  s.style.animationDelay = (-Math.random() * 15) + 's';
  hs.appendChild(s);
}

// Counter
function tick() {
  const start = new Date(C.startDate + 'T00:00:00'), now = new Date();
  let diff = Math.max(0, now - start);
  const d = Math.floor(diff / 864e5), h = Math.floor(diff % 864e5 / 36e5),
        m = Math.floor(diff % 36e5 / 6e4), s = Math.floor(diff % 6e4 / 1e3);
  $('count').innerHTML = [[d,'days'],[h,'hours'],[m,'minutes'],[s,'seconds']]
    .map(x => `<div class="box"><b>${x[0]}</b><small>${x[1]}</small></div>`).join('');
}
tick(); setInterval(tick, 1000);

// Gallery
C.photos.forEach(p => {
  const el = document.createElement('div');
  el.className = 'polaroid';
  el.innerHTML = `<div class="ph">💕</div><p>${p.caption}</p>`;
  const img = new Image();
  img.onload = () => { el.querySelector('.ph').innerHTML = ''; el.querySelector('.ph').appendChild(img); };
  img.src = p.src;
  el.onclick = () => { if (img.complete && img.naturalWidth) { $('lbimg').src = p.src; $('lbcap').textContent = p.caption; $('lightbox').classList.add('on'); } };
  $('gallery').appendChild(el);
});
$('lightbox').onclick = () => $('lightbox').classList.remove('on');

// Notes
C.notes.forEach(n => {
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `<div class="inner"><div class="face front">${n.front}</div><div class="face back">${n.back}</div></div>`;
  el.onclick = () => el.classList.toggle('flip');
  $('notes').appendChild(el);
});

// Background music
let bgAudio = null, ytPlayer = null, playing = false;
const setIcon = () => $('musicBtn').textContent = playing ? '🔊' : '🔇';

function startMusic() {
  if (C.songFile) {
    bgAudio = new Audio(C.songFile);
    bgAudio.loop = true; bgAudio.volume = 0.6;
    bgAudio.play().then(() => { playing = true; setIcon(); }).catch(() => {});
  } else if (C.songYouTubeId) {
    const t = document.createElement('script');
    t.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(t);
    window.onYouTubeIframeAPIReady = () => {
      ytPlayer = new YT.Player('ytHolder', {
        height: '1', width: '1', videoId: C.songYouTubeId,
        playerVars: { loop: 1, playlist: C.songYouTubeId, playsinline: 1 },
        events: { onReady: e => { e.target.setVolume(60); e.target.playVideo(); playing = true; setIcon(); } }
      });
    };
  }
}
function toggleMusic() {
  if (bgAudio) { playing ? bgAudio.pause() : bgAudio.play(); }
  else if (ytPlayer) { playing ? ytPlayer.pauseVideo() : ytPlayer.playVideo(); }
  playing = !playing; setIcon();
}
$('musicBtn').onclick = toggleMusic;
$('openBtn').onclick = () => {
  $('intro').classList.add('hide');
  $('musicBtn').style.display = 'block';
  startMusic();
};

// Song section: pause/play button (music already plays in the background)
$('player').innerHTML = (C.songFile || C.songYouTubeId)
  ? `<button class="btn" id="songToggle">⏯ Play / pause</button>`
  : `<a class="btn" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=And+I+Love+Her+The+Beatles">▶ Play our song</a>`;
if ($('songToggle')) $('songToggle').onclick = toggleMusic;

// Scroll reveal
const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add('show')), { threshold: .15 });
document.querySelectorAll('.reveal').forEach(el => io.observe(el));

// Confetti
const cv = $('cf'), cx = cv.getContext('2d');
let parts = [];
function size() { cv.width = innerWidth; cv.height = innerHeight; }
size(); addEventListener('resize', size);
function loop() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => { p.y += p.vy; p.x += p.vx; p.vy += .12; p.r += p.vr; p.life--;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.font = p.s + 'px serif'; cx.fillText(p.e, 0, 0); cx.restore(); });
  parts = parts.filter(p => p.life > 0 && p.y < cv.height + 40);
  if (parts.length) requestAnimationFrame(loop);
}
$('burst').onclick = e => {
  const r = e.target.getBoundingClientRect(), E = ['💖','💕','🌸','✨','💗','🎉'];
  for (let i = 0; i < 70; i++) parts.push({ x: r.left + r.width / 2, y: r.top + r.height / 2,
    vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 3, r: 0, vr: (Math.random() - .5) * .3,
    s: 16 + Math.random() * 18, e: E[i % E.length], life: 160 });
  loop();
};
</script>
</body>
</html>
